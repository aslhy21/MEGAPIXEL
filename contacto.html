<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Contacto | MegaPIXEL
    </title>

    <link rel="stylesheet"  href="style.css">

    <link rel="stylesheet" href="responsive.css">

</head>


<body>

    <div class="cursor"></div>
    <div class="cursor-follow"></div>


    <header class="header">

        <a
            href="index.html"
            class="header-logo">

            <img
                src="img/logo-megapixel.png"
                alt="MegaPIXEL">

        </a>


        <nav
            class="nav"
            id="nav">

            <a href="index.html">
                Inicio
            </a>

            <a href="nosotros.html">
                Nosotros
            </a>

            <a href="servicios.html">
                Servicios
            </a>

            <a href="portafolio.html">
                Portafolio
            </a>

            <a
                href="contacto.html"
                class="active">
                Contacto
            </a>

        </nav>


        <button
            class="menu-btn"
            id="menuBtn">

            <span></span>
            <span></span>

        </button>

    </header>


    <main>

        <section class="contact-page">

            <div class="contact-title">

                <p class="eyebrow reveal">
                    HABLEMOS
                </p>

                <h1 class="reveal">

                    ¿TIENES

                    <span>
                        UN PROYECTO?
                    </span>

                </h1>

                <p class="reveal">

                    Cuéntanos tu idea y creemos
                    algo diferente juntos.

                </p>

            </div>


            <form
                class="contact-form reveal"
                id="contactForm">


                <div class="input-group">

                    <label for="nombre">
                        NOMBRE
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Tu nombre"
                        required>

                </div>


                <div class="input-group">

                    <label for="email">
                        CORREO
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="correo@ejemplo.com"
                        required>

                </div>


                <div class="input-group">

                    <label for="servicio">
                        SERVICIO
                    </label>

                    <select id="servicio">

                        <option>
                            Branding
                        </option>

                        <option>
                            Diseño gráfico
                        </option>

                        <option>
                            Fotografía
                        </option>

                        <option>
                            Publicidad
                        </option>

                        <option>
                            Diseño web
                        </option>

                    </select>

                </div>


                <div class="input-group">

                    <label for="mensaje">
                        CUÉNTANOS TU IDEA
                    </label>

                    <textarea
                        id="mensaje"
                        rows="6"
                        placeholder="Escribe sobre tu proyecto..."
                        required>
                    </textarea>

                </div>


                <button
                    type="submit"
                    class="form-button">

                    ENVIAR PROYECTO
                    <span>↗</span>

                </button>

            </form>

        </section>

    </main>


    <script src="js.script.js"></script>

</body>

</html>
